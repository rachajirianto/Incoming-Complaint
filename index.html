<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Complaint Monitoring Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Recharts -->
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #121212; color: #E0E0E0; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const { LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Legend, CartesianGrid } = Recharts;

    function App() {
      const [activeTab, setActiveTab] = useState('overview');
      const [channelFilter, setChannelFilter] = useState('ALL');

      const [data, setData] = useState([
        { id: 1, date: '2026-11-01', week: 'W1 Nov', month: '2026-11', channel: 'Email', company: 'SSS', type: 'External', bucket: 'B1 (1-30)', valid: true },
        { id: 2, date: '2026-11-02', week: 'W1 Nov', month: '2026-11', channel: 'OJK', company: 'Indocoll', type: 'External', bucket: 'B2 (31-60)', valid: true },
        { id: 3, date: '2026-11-03', week: 'W1 Nov', month: '2026-11', channel: 'AFPI', company: 'Inhouse Desk Coll', type: 'Inhouse', bucket: 'B1 (1-30)', valid: false },
        { id: 4, date: '2026-11-04', week: 'W1 Nov', month: '2026-11', channel: 'Email', company: 'KAT', type: 'External', bucket: 'WO (90+)', valid: true },
        { id: 5, date: '2026-11-05', week: 'W1 Nov', month: '2026-11', channel: 'OJK', company: 'Telmark', type: 'External', bucket: 'B3 (61-90)', valid: true },
        { id: 6, date: '2026-11-06', week: 'W1 Nov', month: '2026-11', channel: 'AFPI', company: 'RADA', type: 'External', bucket: 'B1 (1-30)', valid: false },
        { id: 7, date: '2026-11-07', week: 'W1 Nov', month: '2026-11', channel: 'Email', company: 'CPU', type: 'External', bucket: 'B2 (31-60)', valid: true },
        { id: 8, date: '2026-11-08', week: 'W2 Nov', month: '2026-11', channel: 'OJK', company: 'STP', type: 'External', bucket: 'WO (90+)', valid: true },
      ]);

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          const lines = text.split('\n');
          const parsed = [];
          
          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',');
            if (cols.length >= 6) {
              const d = new Date(cols[0].trim());
              const weekName = !isNaN(d.getTime()) ? `W${Math.ceil(d.getDate() / 7)} ${d.toLocaleString('default', { month: 'short' })}` : 'W1';
              parsed.push({
                id: i,
                date: cols[0]?.trim() || '',
                week: weekName,
                month: cols[0]?.substring(0, 7) || '2026-11',
                channel: cols[1]?.trim() || 'Email',
                company: cols[2]?.trim() || 'Unassigned',
                type: cols[3]?.trim() || 'External',
                bucket: cols[4]?.trim() || 'B1 (1-30)',
                valid: String(cols[5]).toLowerCase().includes('valid') && !String(cols[5]).toLowerCase().includes('invalid')
              });
            }
          }
          if (parsed.length > 0) setData(parsed);
        };
        reader.readAsText(file);
      };

      const filteredData = useMemo(() => {
        return channelFilter === 'ALL' ? data : data.filter(d => d.channel === channelFilter);
      }, [data, channelFilter]);

      const totalComplaints = filteredData.length;
      const validComplaints = filteredData.filter(d => d.valid).length;
      const validityRate = totalComplaints > 0 ? ((validComplaints / totalComplaints) * 100).toFixed(1) : 0;

      const matrixData = useMemo(() => {
        const map = {};
        data.forEach(item => {
          if (!map[item.company]) {
            map[item.company] = { company: item.company, type: item.type, emailTotal: 0, emailValid: 0, ojkTotal: 0, ojkValid: 0, afpiTotal: 0, afpiValid: 0, total: 0, valid: 0 };
          }
          map[item.company].total += 1;
          if (item.valid) map[item.company].valid += 1;

          if (item.channel === 'Email') {
            map[item.company].emailTotal += 1;
            if (item.valid) map[item.company].emailValid += 1;
          } else if (item.channel === 'OJK') {
            map[item.company].ojkTotal += 1;
            if (item.valid) map[item.company].ojkValid += 1;
          } else if (item.channel === 'AFPI') {
            map[item.company].afpiTotal += 1;
            if (item.valid) map[item.company].afpiValid += 1;
          }
        });
        return Object.values(map);
      }, [data]);

      return (
        <div className="min-h-screen p-6 max-w-7xl mx-auto space-y-6">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-900 p-6 rounded-xl border border-gray-800 gap-4">
            <div>
              <h1 className="text-2xl font-bold text-white tracking-wide">QC COMPLAINT MONITORING DASHBOARD</h1>
              <p className="text-gray-400 text-sm mt-1">Multi-Channel, Vendor & Bucket Performance Analytics</p>
            </div>
            
            <div className="flex items-center gap-3">
              <label className="bg-yellow-500 hover:bg-yellow-600 text-black font-semibold px-4 py-2 rounded-lg cursor-pointer transition duration-200 text-sm">
                Upload CSV File
                <input type="file" accept=".csv" onChange={handleFileUpload} className="hidden" />
              </label>
            </div>
          </div>

          <div className="flex flex-wrap justify-between items-center bg-gray-900 p-4 rounded-xl border border-gray-800 gap-4">
            <div className="flex gap-2">
              <button 
                onClick={() => setActiveTab('overview')} 
                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'overview' ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}>
                Overview Trends
              </button>
              <button 
                onClick={() => setActiveTab('matrix')} 
                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'matrix' ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}`}>
                Channel & Bucket Matrix
              </button>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-400">Channel Filter:</span>
              {['ALL', 'Email', 'OJK', 'AFPI'].map(ch => (
                <button
                  key={ch}
                  onClick={() => setChannelFilter(ch)}
                  className={`px-3 py-1 rounded text-xs font-semibold transition ${channelFilter === ch ? 'bg-yellow-500 text-black' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}`}>
                  {ch}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-gray-900 p-5 rounded-xl border border-gray-800">
              <p className="text-xs font-semibold text-gray-400 tracking-wider uppercase">Total Incoming Complaints</p>
              <p className="text-3xl font-extrabold text-yellow-400 mt-2">{totalComplaints}</p>
            </div>
            <div className="bg-gray-900 p-5 rounded-xl border border-gray-800">
              <p className="text-xs font-semibold text-gray-400 tracking-wider uppercase">Valid Complaints</p>
              <p className="text-3xl font-extrabold text-purple-400 mt-2">{validComplaints}</p>
            </div>
            <div className="bg-gray-900 p-5 rounded-xl border border-gray-800">
              <p className="text-xs font-semibold text-gray-400 tracking-wider uppercase">Validity Rate (%)</p>
              <p className="text-3xl font-extrabold text-teal-400 mt-2">{validityRate}%</p>
            </div>
          </div>

          {activeTab === 'overview' && (
            <div className="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
              <h3 className="text-lg font-bold text-white">Vendor & Inhouse Breakdown</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left text-gray-300">
                  <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
                    <tr>
                      <th className="p-3">Company / Vendor</th>
                      <th className="p-3">Type</th>
                      <th className="p-3 text-center">Total Complaints</th>
                      <th className="p-3 text-center">Valid</th>
                      <th className="p-3 text-center">Validity Rate</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-800">
                    {matrixData.map((row, idx) => (
                      <tr key={idx} className="hover:bg-gray-800/50">
                        <td className="p-3 font-semibold text-white">{row.company}</td>
                        <td className="p-3">
                          <span className={`px-2 py-0.5 text-xs rounded ${row.type === 'Inhouse' ? 'bg-blue-900 text-blue-300' : 'bg-orange-900 text-orange-300'}`}>
                            {row.type}
                          </span>
                        </td>
                        <td className="p-3 text-center font-bold">{row.total}</td>
                        <td className="p-3 text-center text-purple-400 font-bold">{row.valid}</td>
                        <td className="p-3 text-center text-teal-400 font-bold">
                          {row.total > 0 ? ((row.valid / row.total) * 100).toFixed(1) : 0}%
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab === 'matrix' && (
            <div className="bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
              <h3 className="text-lg font-bold text-white">Channel breakdown Matrix (Total / Valid)</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-sm text-left text-gray-300 border-collapse">
                  <thead className="bg-gray-800 text-gray-400 text-xs uppercase">
                    <tr>
                      <th className="p-3 border border-gray-700">Company</th>
                      <th className="p-3 border border-gray-700 text-center" colSpan="2">Email (Tot / Val)</th>
                      <th className="p-3 border border-gray-700 text-center" colSpan="2">OJK (Tot / Val)</th>
                      <th className="p-3 border border-gray-700 text-center" colSpan="2">AFPI (Tot / Val)</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-800">
                    {matrixData.map((row, idx) => (
                      <tr key={idx} className="hover:bg-gray-800/50">
                        <td className="p-3 font-semibold text-white border border-gray-800">{row.company}</td>
                        <td className="p-3 text-center border border-gray-800">{row.emailTotal}</td>
                        <td className="p-3 text-center border border-gray-800 text-purple-400 font-bold">{row.emailValid}</td>
                        <td className="p-3 text-center border border-gray-800">{row.ojkTotal}</td>
                        <td className="p-3 text-center border border-gray-800 text-purple-400 font-bold">{row.ojkValid}</td>
                        <td className="p-3 text-center border border-gray-800">{row.afpiTotal}</td>
                        <td className="p-3 text-center border border-gray-800 text-purple-400 font-bold">{row.afpiValid}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
